<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CookToSave — Buscar receitas</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pagina2.css">

</head>
<body>

<div id="avisoFlutuante" class="aviso-flutuante" aria-live="polite"></div>

<div class="topbar">
<div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 px-6 py-6">

  <div class="flex items-center gap-4">
    <img src="cooktosave.jpeg" class="w-14">
    <div>
      <h1>CookToSave</h1>
      <p>Bem-vindo! Descubra receitas com o que você já tem em casa.</p>
    </div>
  </div>

  <div class="flex items-center gap-3">
    <button onclick="mostrarFavoritos()" class="btn btn-outline-light">
      ♥ Favoritos <span id="contadorFavoritos">0</span>
    </button>

    <button onclick="logout()" class="btn btn-danger">
      Sair
    </button>
  </div>

</div>
</div>

<div class="max-w-7xl mx-auto p-6">

<div class="search-panel mb-10">

  <h2 class="text-2xl mb-1">Buscar receitas</h2>
  <p class="text-muted mb-6">Liste os ingredientes que você tem, separados por vírgula.</p>

  <textarea
  id="ingredientes"
  placeholder="Ex: ovo, tomate, queijo, cebola..."
  class="mb-5"></textarea>

  <div class="flex flex-wrap items-center gap-3">
    <button onclick="buscarReceitas()" class="btn btn-gold">
      Buscar receitas
    </button>

    <button onclick="limparDespensa()" class="btn btn-outline">
      Limpar lista
    </button>
  </div>

  <p class="text-muted mt-4" style="font-size:.8rem;">
    Sua lista de ingredientes fica salva na sua conta.
  </p>

</div>

<div id="resultado"></div>

</div>

<p class="text-center text-muted py-8" style="font-size:.85rem;">
Receitas brasileiras — banco local, sem uso de APIs externas.
</p>

<script type="module" src="js/pagina2.js"></script>

</body>
</html>
